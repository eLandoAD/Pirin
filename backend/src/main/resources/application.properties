# Configurazione Applicazione
spring.application.name=Pirin

# Connessione al Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/secure_files
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=placeholder@gmail.com
spring.mail.password=placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=cambia-questa-stringa-con-una-lunga-almeno-32-caratteri
jwt.expiration-ms=86400000

# Storage file sul disco
storage.path=uploads

# URL frontend (usato nei link email)
app.frontend-url=http://localhost:5173